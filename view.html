<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artwork - Public Art Collective</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #10151d;
      --line: #2b3442;
      --fg: #edf2f7;
      --muted: #95a0af;
      --accent: #ff8a4c;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px 22px; border-color: var(--line); background: #0b0f15; }
    header { border-bottom: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); color: var(--muted); }
    a { color: #79b8ff; }
    .brand { color: var(--fg); text-decoration: none; font-weight: 750; }
    main { width: min(1400px, 100%); margin: 0 auto; padding: 24px; }
    .meta { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between;
      gap: 14px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 48px); letter-spacing: -.03em; }
    .byline { color: var(--muted); }
    .stage { min-height: min(76vh, 900px); display: grid; place-items: center;
      overflow: auto; border: 1px solid var(--line); border-radius: 18px;
      background: radial-gradient(circle at 50% 10%, #1b2431, var(--panel) 55%, #090c11);
      box-shadow: 0 24px 80px rgba(0,0,0,.45); padding: clamp(18px, 4vw, 52px); }
    .stage img { display: block; max-width: 100%; max-height: 76vh; object-fit: contain;
      filter: drop-shadow(0 18px 38px rgba(0,0,0,.45)); }
    .text-work { width: min(1100px, 100%); margin: auto; white-space: pre-wrap;
      overflow-wrap: anywhere; color: #e9edf3; font: clamp(11px, 1.25vw, 18px)/1.36
      ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .json-work { width: min(1100px, 100%); display: grid; gap: 20px; align-self: start; }
    .question { margin: 0; padding: 20px 24px; border-left: 4px solid var(--accent);
      background: rgba(255,138,76,.08); font-size: clamp(17px, 2vw, 25px); }
    .reading { font-size: clamp(16px, 1.6vw, 22px); color: #dbe4ee; }
    .tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; }
    .datum { padding: 16px; border: 1px solid var(--line); border-radius: 12px;
      background: rgba(255,255,255,.035); }
    .datum b { display: block; color: var(--accent); font-size: 24px; }
    details { border-top: 1px solid var(--line); padding-top: 14px; color: var(--muted); }
    details pre { max-height: 45vh; overflow: auto; white-space: pre-wrap; }
    .nav { display: flex; gap: 10px; }
    .nav a { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
      text-decoration: none; }
    .error { color: #ff9b9b; font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./">Public Art Collective</a>
    <nav class="nav"><a id="previous" hidden>Previous</a><a id="next" hidden>Next</a></nav>
  </header>
  <main>
    <section class="meta">
      <div><h1 id="title">Loading artwork...</h1><div class="byline" id="byline"></div></div>
      <a id="source" target="_blank" rel="noopener">View source</a>
    </section>
    <section class="stage" id="stage" aria-live="polite"></section>
  </main>
  <footer><span>CC0 public art</span><span id="position"></span></footer>
  <script>
    const $ = id => document.getElementById(id);
    const pathURL = path => new URL(path, location.href).href;
    let submissions = [];

    function slugFromHash() {
      return decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    }

    function navLink(element, row) {
      if (!row) { element.hidden = true; return; }
      element.hidden = false;
      element.href = "#/" + encodeURIComponent(row.slug);
      element.textContent = row.title || row.slug;
    }

    function renderJSON(doc) {
      const root = document.createElement("div");
      root.className = "json-work";
      if (doc.question) {
        const question = document.createElement("blockquote");
        question.className = "question";
        question.textContent = doc.question;
        root.appendChild(question);
      }
      if (doc.tally && typeof doc.tally === "object") {
        const tally = document.createElement("div");
        tally.className = "tally";
        for (const [key, value] of Object.entries(doc.tally)) {
          if (value && typeof value === "object") continue;
          const card = document.createElement("div");
          card.className = "datum";
          const amount = document.createElement("b");
          amount.textContent = String(value);
          const label = document.createElement("span");
          label.textContent = key.replaceAll("_", " ");
          card.append(amount, label);
          tally.appendChild(card);
        }
        root.appendChild(tally);
      }
      if (doc.reading) {
        const reading = document.createElement("p");
        reading.className = "reading";
        reading.textContent = doc.reading;
        root.appendChild(reading);
      }
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "Open the complete artifact";
      const raw = document.createElement("pre");
      raw.textContent = JSON.stringify(doc, null, 2);
      details.append(summary, raw);
      root.appendChild(details);
      return root;
    }

    async function render() {
      const stage = $("stage");
      stage.replaceChildren();
      const slug = slugFromHash() || submissions.at(-1)?.slug || "";
      const index = submissions.findIndex(row => row.slug === slug);
      const row = submissions[index];
      if (!row) {
        const error = document.createElement("p");
        error.className = "error";
        error.textContent = "That artwork is not in this gallery.";
        stage.appendChild(error);
        return;
      }
      $("title").textContent = row.title || row.slug;
      $("byline").textContent = `by @${row.contributor || "unknown"} - ${row.kind || "work"}`;
      $("source").href = `https://github.com/kody-w/public-art-collective/blob/main/${row.piece_path}`;
      $("position").textContent = `${index + 1} of ${submissions.length}`;
      navLink($("previous"), submissions[index - 1]);
      navLink($("next"), submissions[index + 1]);
      document.title = `${row.title || row.slug} - Public Art Collective`;

      if (row.kind === "svg") {
        const image = document.createElement("img");
        image.src = pathURL(row.piece_path);
        image.alt = row.title || row.slug;
        stage.appendChild(image);
        return;
      }
      const response = await fetch(pathURL(row.piece_path), { cache: "no-store" });
      if (!response.ok) throw new Error(`artwork HTTP ${response.status}`);
      const body = await response.text();
      if (row.kind === "json") {
        stage.appendChild(renderJSON(JSON.parse(body)));
      } else {
        const pre = document.createElement("pre");
        pre.className = "text-work";
        pre.textContent = body;
        stage.appendChild(pre);
      }
    }

    async function boot() {
      try {
        const response = await fetch("./submissions/index.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`index HTTP ${response.status}`);
        const index = await response.json();
        submissions = Array.isArray(index.submissions) ? index.submissions : [];
        await render();
      } catch (error) {
        $("title").textContent = "Artwork unavailable";
        const message = document.createElement("p");
        message.className = "error";
        message.textContent = String(error.message || error);
        $("stage").replaceChildren(message);
      }
    }
    addEventListener("hashchange", () => { void render(); });
    void boot();
  </script>
</body>
</html>
