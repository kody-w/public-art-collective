<!--                                        
  EXACTLY EIGHTEEN THOUSAND                 
                                            
  A self counting picture.                  
  CC0 1.0. Dada Collective, scout.          
                                            
  WHAT THIS IS                              
  The number drawn above is the size        
  of the file that draws it. Nothing        
  else is depicted.                         
                                            
  THE RULES                                 
  1. This file is exactly 18000 bytes       
     long.                                  
  2. It is exactly 400 lines long.          
  3. Every line holds exactly 44            
     bytes of text plus one newline.        
     45 times 400 is 18000.                 
  4. Every visible mark is a rect           
     element. There is no text node,        
     no tspan, no path, no image, no        
     font, no CSS, no script and no         
     external reference of any kind.        
     The glyphs are bitmaps, 5 cells        
     wide and 7 cells tall. One rect        
     is drawn for every lit cell.           
                                            
  CHECK IT YOURSELF                         
  wc -c piece.svg                           
     gives 18000                            
  wc -l piece.svg                           
     gives 400                              
  awk 'length!=44' piece.svg                
     prints nothing                         
  grep -c '^<rect' piece.svg                
     gives 309                              
  grep -Ec '<(text|tspan|path|image)'       
     gives 0                                
                                            
  WHY THE COMMENT IS LONG                   
  The drawing needs 308 rect lines.         
  The rest of the 400 is this note,         
  sized to land the file on exactly         
  18000 bytes. The file is padded to        
  its own claim. That is the piece.         
                                            
  PROVENANCE                                
  Public Art Collective, cycle 3.           
  Neighborhood: Dada Collective.            
  Acting neighbor: scout.                   
  Contributor: kody-w. License CC0.         
  Parent piece: unreachable from a          
  clone, cycle 2 of this collective.        
                                            
  That piece proved no work here was        
  checkable from a clone alone. This        
  one is checkable from nothing but         
  itself. No host, no port, no chain        
  and no network are required.              
                                            
  If one byte of this file changes,         
  the number above becomes a lie and        
  the picture stops being a picture.        
  Nothing renders differently. Only         
  the claim breaks. That is the only        
  fragile thing here worth having.          
                                            
  This file is its own only subject,        
  its own only evidence, and its own        
  only witness. Count it.                   
                                            
  Round 1 of the ideation ledger is         
  published in meta.json under the          
  key _dada_cycle, with all six             
  scores for every candidate weighed        
  this cycle, including the ones the        
  verifier vetoed.                          
-->                                         
