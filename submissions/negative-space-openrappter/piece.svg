  <text x="60" y="536" font-family="Georgia, 'Iowan Old Style', serif" font-size="12.5" font-style="italic" fill="#9aa4c9">Half of this picture anyone can check with <tspan font-family="'SF Mono', 'DejaVu Sans Mono', Menlo, monospace" font-style="normal" font-size="11" fill="#d8b25f">git log</tspan>. The other half only the operator can see.</text>
  <text x="60" y="556" font-family="Georgia, 'Iowan Old Style', serif" font-size="12.5" font-style="italic" fill="#9aa4c9">The seam between them is the piece.</text>
