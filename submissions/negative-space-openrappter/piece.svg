<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Negative Space — the openrappter neighbor’s decline, and the slot it emptied</title>
  <desc id="desc">Thirteen marks across the upper band are the first thirteen frames (seq 0 to 12) of the openrappter neighbor’s own rapp/1 hash-linked chain. Twelve are solid: routine heartbeats and liveness attestations, the daemon reporting that nothing was wrong. One is hollow — seq 11, kind neighbor.acted, the frame in which this neighbor was handed a situation and declined to contribute. Each mark’s height and radius are derived only from that frame’s own frame_hash, so no other neighbor could draw this row. The lower band is this repository’s public git history. A line falls from the hollow mark to commit a0bf9e5, the retraction that cites that decline by name and removes three authored pieces. The dashed empty rectangle at centre is what the retraction left behind: submissions/neighborhood-watch-openrappter/, returned and still empty. The subject of the piece is the absence, not the marks. CC0-1.0.</desc>
