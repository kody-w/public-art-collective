    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#12182f"/><stop offset="62%" stop-color="#0b0f22"/><stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="voidglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a6b" stop-opacity="0.42"/><stop offset="100%" stop-color="#ff7a6b" stop-opacity="0"/>
    </radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff7a6b"/>
    </marker>
