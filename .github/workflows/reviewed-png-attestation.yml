name: Reviewed PNG provenance

# Security boundary: pull_request_target loads this workflow from the protected
# base branch. The trusted validator runs from the protected main tip, while
# the sparse candidate submissions/workflows checkout is data only; no script,
# action, or workflow from the PR head is executed.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    # Intentionally no paths filter: a required path-filtered workflow leaves
    # unrelated PRs waiting forever because its status is never created.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reviewed-png-provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-controller-provenance:
    name: Verify controller provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted validator from protected main tip
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kody-w/public-art-collective
          # Use the protected default-branch tip; base.sha stays for ancestry
          # checks inside the trusted validator, not for code checkout.
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout untrusted candidate data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          sparse-checkout: |
            submissions
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Validate candidate workflow policy and protected PNG provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 trusted/tools/verify_png_attestation.py
          --event-path "$GITHUB_EVENT_PATH"
          --candidate-root candidate
          --base-root trusted
          --trusted-base-sha "$(git -C trusted rev-parse HEAD)"
